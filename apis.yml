aid: grabr
name: Grabr
description: 'Grabr is a peer-to-peer cross-border shopping marketplace, founded in
  2015 in San Francisco, that connects shoppers wanting products unavailable or expensive
  in their home country with travelers who deliver those items during trips in exchange
  for a reward. Grabr handles secure online payments, calculates duties and fees upfront,
  and holds funds in escrow until delivery is confirmed, operating across 75+ countries.
  It is a consumer mobile-app marketplace (iOS and Android) with a sibling fintech
  product, GrabrFi (US banking for non-residents). Grabr does not publish a public
  developer API, OpenAPI, or developer portal; this profile captures its identity,
  support, legal, and domain-security surface for the API Evangelist network.'
